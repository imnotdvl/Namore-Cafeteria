<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio - Namore Cafeteria</title>
    <link rel="stylesheet" href="cardapio.css">
</head>
<body>
    
    <a href="/index/index.html" ><button class="botao-navegacao">Início</button></a>
    
    <section class="ctlg">
            <h3 id="catalogo-produtos">Cardápio Completo</h3>
            <div class="elementos">
                <h4>Bebidas Quentes</h4>
                <h4>Bolos</h4>
                <h4>Salgados</h4>
                <h4>Bebidas Frias</h4>
            </div>
            <section class="card-produtos">

                <div class="cards">
                    <img class="imagem-catalogo" src="img/cappuccino.jpeg" alt="Cappuccino Tradicional">
                    <p class="descricao-produto">Cappuccino Tradicional</p>
                    <p class="preco-produto">R$ 14,90</p>
                </div>

                <div class="cards">
                    <img class="imagem-catalogo" src="img/bolo.png" alt="Bolo de Chocolate">
                    <p class="descricao-produto">Bolo de Chocolate</p>
                    <p class="preco-produto">R$ 12,90</p>
                </div>

                <div class="cards">
                    <img class="imagem-catalogo" src="img/salgado.png" alt="Croissant">
                    <p class="descricao-produto">Croissant</p>
                    <p class="preco-produto">R$ 10,90</p>
                </div>

                <div class="cards">
                    <img class="imagem-catalogo" src="img/bebida.png" alt="Café Gelado">
                    <p class="descricao-produto">Café Gelado</p>
                    <p class="preco-produto">R$ 8,90</p>
                </div>

                <div class="cards">
                    <img class="imagem-catalogo" src="img/cafepreto.png" alt="Café Preto">
                    <p class="descricao-produto">Café Preto</p>
                    <p class="preco-produto">R$ 3,90</p>
                </div>

                <div class="cards">
                    <img class="imagem-catalogo" src="img/bolo2.png" alt="Bolo de Morango">
                    <p class="descricao-produto">Bolo de Morango</p>
                    <p class="preco-produto">R$ 12,90</p>
                </div>

                <div class="cards">
                    <img class="imagem-catalogo" src="img/italiano.png" alt="Italiano">
                    <p class="descricao-produto">Italiano</p>
                    <p class="preco-produto">R$ 7,90</p>
                </div>

                <div class="cards">
                    <img class="imagem-catalogo" src="img/sucolaranja.png" alt="Suco de Laranja">
                    <p class="descricao-produto">Suco de Laranja</p>
                    <p class="preco-produto">R$ 4,90</p>
                </div>
            </section>
        </section>
</body>
</html>
